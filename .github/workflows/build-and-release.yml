name: Build & Publish Release

on:
  push:
    branches:
      - feature/clipboard-history
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force publish release even if already exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: read

jobs:
  test-and-release:
    name: Test, Build & Release
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Run Tests & Verification
        run: |
          cd pixelboard-patches
          chmod +x gradlew
          ./gradlew test -x :extensions:extension:testDebugUnitTest --info

      - name: Build Patch Bundle (.mpp)
        run: |
          cd pixelboard-patches
          ./gradlew :patches:buildAndroid
          cd ..
          mkdir -p patches output tools/patcher-data
          COMPILED_MPP=$(ls pixelboard-patches/patches/build/libs/patches-*.mpp 2>/dev/null | grep -v 'javadoc' | grep -v 'sources' | head -n 1)
          cp "$COMPILED_MPP" patches/PixelBoard.mpp
          cp "$COMPILED_MPP" patches/patches-clipboard.mpp

      - name: Build Release APK
        id: build_apk
        run: |
          mkdir -p input output
          if [ -n "${{ secrets.STOCK_GBOARD_URL }}" ]; then
            echo "Downloading stock Gboard APK from secret URL..."
            curl -L -o input/gboard.apk "${{ secrets.STOCK_GBOARD_URL }}"

            echo "Generating release keystore..."
            keytool -genkeypair \
              -keystore tools/patcher-data/pixelboard.keystore \
              -alias pixelboard \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass pixelboard \
              -keypass pixelboard \
              -dname "CN=PixelBoard, OU=PixelBoard, O=PixelBoard, L=Unknown, ST=Unknown, C=US" \
              >/dev/null 2>&1

            echo "Patching APK with patcher.jar..."
            java -jar tools/patcher.jar patch \
              --patches=patches/PixelBoard.mpp \
              --options-file=options.json \
              --striplibs=arm64-v8a \
              --signer="PixelBoard" \
              --keystore=tools/patcher-data/pixelboard.keystore \
              --keystore-password=pixelboard \
              --keystore-entry-alias=pixelboard \
              --keystore-entry-password=pixelboard \
              --temporary-files-path=tools/patcher-data/tmp \
              -o=output/PixelBoard-clipboard-history.apk \
              -r=output/patching-result.json \
              input/gboard.apk

            echo "has_apk=true" >> $GITHUB_OUTPUT
          else
            echo "STOCK_GBOARD_URL secret is not set. Skipping full APK patching step."
            echo "has_apk=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine Upstream Release Tag
        id: release_info
        run: |
          UPSTREAM_TAG=$(gh release view -R Akshayykadam/PixelBoard --json tagName -q .tagName)
          RELEASE_TAG="${UPSTREAM_TAG}-clipboard"
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "upstream_tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        run: |
          TAG="${{ steps.release_info.outputs.release_tag }}"
          UPSTREAM_TAG="${{ steps.release_info.outputs.upstream_tag }}"
          FORCE="${{ github.event.inputs.force_release }}"

          if [ "$FORCE" != "true" ] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists on fork. Skipping duplicate release creation."
            exit 0
          fi

          FILES="patches/PixelBoard.mpp"
          if [ "${{ steps.build_apk.outputs.has_apk }}" = "true" ] && [ -f output/PixelBoard-clipboard-history.apk ]; then
            FILES="$FILES output/PixelBoard-clipboard-history.apk"
          fi

          cat << 'EOF' > /tmp/release_notes.md
          ## PixelBoard Clipboard Edition ($UPSTREAM_TAG)

          Based on upstream **[$UPSTREAM_TAG](https://github.com/Akshayykadam/PixelBoard/releases/tag/$UPSTREAM_TAG)**.

          ### Features Included:
          - **Clipboard History**: Integrated clipboard history manager directly in Advanced Settings.
          - **Image Previews**: Inline 52dp thumbnails for screenshots and copied images with viewer hand-off.
          - **Background Sync**: Back-fill clips copied under other keyboards on input view activation.
          - **Companion Provider**: Secure ContentProvider (`content://com.akshaykadam.pixelboard.gboard_clipboard_history/clips`) with token-based authentication and live `/primary` endpoint.
          - **Sensitive Protection**: Automatic filtering of sensitive clips (passwords).
          EOF

          gh release create "$TAG" $FILES \
            --title "PixelBoard Clipboard Edition ($UPSTREAM_TAG)" \
            --notes-file /tmp/release_notes.md \
            --target feature/clipboard-history
